<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- A-Frame + MindAR -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    /* FORCE CAMERA FEED TO BE VISIBLE (CRITICAL) */
    #arjs-video,
    video[id*="arjs"],
    video[id*="mindar"] {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      z-index: 1 !important;
    }

    a-scene {
      position: fixed;
      inset: 0;
      z-index: 2;
    }

    /* Video overlay */
    #videoOverlay {
      position: fixed;
      inset: 0;
      background: black;
      display: none;
      z-index: 10;
    }

    #videoOverlay.show {
      display: block;
    }

    #videoOverlay video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Tap to start */
    #startBtn {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.9);
      color: white;
      font-size: 22px;
      z-index: 20;
    }
  </style>
</head>

<body>

<!-- TAP TO START -->
<div id="startBtn">Tap to start</div>

<!-- VIDEO OVERLAY -->
<div id="videoOverlay">
  <video
    id="overlayVideo"
    playsinline
    webkit-playsinline
    preload="auto">
  </video>
</div>

<!-- SCENE A → targets.mind -->
<a-scene
  id="sceneA"
  mindar-image="imageTargetSrc: ./targets.mind;"
  embedded
  renderer="alpha: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">
  <a-camera look-controls="false"></a-camera>
  <a-entity mindar-image-target="targetIndex: 0"></a-entity>
</a-scene>

<!-- SCENE B → targets1.mind -->
<a-scene
  id="sceneB"
  mindar-image="imageTargetSrc: ./targets1.mind;"
  embedded
  renderer="alpha: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">
  <a-camera look-controls="false"></a-camera>
  <a-entity mindar-image-target="targetIndex: 0"></a-entity>
</a-scene>

<script>
const startBtn = document.getElementById("startBtn");
const overlay = document.getElementById("videoOverlay");
const video = document.getElementById("overlayVideo");

const sceneA = document.getElementById("sceneA");
const sceneB = document.getElementById("sceneB");

let videoStarted = false;

/* Force camera video visibility again after start */
function forceCameraVisible() {
  const v =
    document.getElementById("arjs-video") ||
    document.querySelector('video[id*="arjs"]') ||
    document.querySelector('video[id*="mindar"]');
  if (v) {
    v.style.display = "block";
    v.style.visibility = "visible";
    v.style.opacity = "1";
  }
}

/* Play video */
function playVideo(src) {
  if (videoStarted) return;
  videoStarted = true;

  sceneA.style.display = "none";
  sceneB.style.display = "none";

  video.src = src;
  video.currentTime = 0;
  video.muted = false;

  overlay.classList.add("show");
  video.play();
}

/* Target listeners */
sceneA.addEventListener("targetFound", () => {
  playVideo("./video.mp4");
});

sceneB.addEventListener("targetFound", () => {
  playVideo("./video1.mp4");
});

/* Start AR on tap (required on mobile) */
startBtn.addEventListener("click", () => {
  startBtn.style.display = "none";

  sceneA.systems["mindar-image-system"].start();
  sceneB.systems["mindar-image-system"].start();

  setTimeout(forceCameraVisible, 500);
});
</script>

</body>
</html>
