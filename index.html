<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Harishankar through time</title>

  <!-- A-Frame + MindAR -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    a-scene {
      position: fixed;
      inset: 0;
    }

    /* FORCE CAMERA FEED */
    video[id*="mindar"],
    video[id*="arjs"],
    #arjs-video {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: 1 !important;
      display: block !important;
      opacity: 1 !important;
      visibility: visible !important;
    }

    #videoOverlay {
      position: fixed;
      inset: 0;
      background: black;
      display: none;
      z-index: 10;
    }

    #videoOverlay.show {
      display: block;
    }

    #videoOverlay video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #startOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      color: white;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }
  </style>
</head>

<body>

<div id="startOverlay">Tap to start</div>

<div id="videoOverlay">
  <video id="overlayVideo" playsinline webkit-playsinline></video>
</div>

<a-scene
  id="scene"
  mindar-image="imageTargetSrc: ./targets.mind;"
  embedded
  renderer="alpha: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>
  <a-camera look-controls="false"></a-camera>

  <!-- TARGET 0 -->
  <a-entity mindar-image-target="targetIndex: 0"></a-entity>

  <!-- TARGET 1 -->
  <a-entity mindar-image-target="targetIndex: 1"></a-entity>
</a-scene>

<script>
const start = document.getElementById("startOverlay");
const scene = document.getElementById("scene");
const overlay = document.getElementById("videoOverlay");
const video = document.getElementById("overlayVideo");

let played = false;

function play(src) {
  if (played) return;
  played = true;

  scene.style.display = "none";
  overlay.classList.add("show");

  video.src = src;
  video.currentTime = 0;
  video.muted = false;
  video.play();
}

scene.addEventListener("targetFound", e => {
  const index = e.detail.targetIndex;
  if (index === 0) play("./video.mp4");
  if (index === 1) play("./video1.mp4");
});

start.addEventListener("click", () => {
  start.style.display = "none";
  scene.systems["mindar-image-system"].start();
});
</script>

</body>
</html>
