<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Harishankar through time</title>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image.prod.js"></script>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    a-scene {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    #tapToStart {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(0,0,0,0.65);
      z-index: 9999;
    }

    #tapToStart button {
      font-size: 18px;
      padding: 14px 18px;
      border-radius: 12px;
      border: none;
    }

    #videoOverlay {
      position: fixed;
      inset: 0;
      display: none;
      background: black;
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    #videoOverlay.show {
      display: flex;
    }

    #videoOverlay video {
      height: 100vh;
      width: auto;
      aspect-ratio: 9 / 16;
      object-fit: contain;
    }
  </style>
</head>

<body>

<!-- Tap to unlock playback -->
<div id="tapToStart">
  <button id="startBtn">Tap to start</button>
</div>

<!-- Scene A → targets.mind -->
<a-scene
  id="sceneA"
  mindar-image="imageTargetSrc: ./targets.mind;"
  embedded
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera look-controls="false"></a-camera>
  <a-entity mindar-image-target="targetIndex: 0"></a-entity>
</a-scene>

<!-- Scene B → targets1.mind -->
<a-scene
  id="sceneB"
  mindar-image="imageTargetSrc: ./targets1.mind;"
  embedded
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera look-controls="false"></a-camera>
  <a-entity mindar-image-target="targetIndex: 0"></a-entity>
</a-scene>

<!-- Fullscreen video overlay -->
<div id="videoOverlay">
  <video
    id="overlayVideo"
    loop
    playsinline
    webkit-playsinline>
  </video>
</div>

<script>
  const startBtn = document.getElementById("startBtn");
  const tapOverlay = document.getElementById("tapToStart");

  const sceneA = document.getElementById("sceneA");
  const sceneB = document.getElementById("sceneB");

  const videoOverlay = document.getElementById("videoOverlay");
  const overlayVideo = document.getElementById("overlayVideo");

  let started = false;
  let videoPlaying = false;

  function playVideo(src) {
    if (videoPlaying) return;
    videoPlaying = true;

    sceneA.style.display = "none";
    sceneB.style.display = "none";

    overlayVideo.src = src;
    overlayVideo.currentTime = 0;
    overlayVideo.muted = false;

    videoOverlay.classList.add("show");
    overlayVideo.play();
  }

  startBtn.addEventListener("click", async () => {
    tapOverlay.style.display = "none";

    if (!started) {
      started = true;

      await sceneA.systems["mindar-image-system"].start();
      await sceneB.systems["mindar-image-system"].start();
    }
  });

  // targets.mind → video.mp4
  sceneA.addEventListener("targetFound", () => {
    playVideo("./video.mp4");
  });

  // targets1.mind → video1.mp4
  sceneB.addEventListener("targetFound", () => {
    playVideo("./video1.mp4");
  });
</script>

</body>
</html>
